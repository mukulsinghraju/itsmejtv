<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap"
rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Inter", sans-serif;
}

.player {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* CENTER PLAY */

.center-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 105px;
    height: 105px;

    border: 7px solid rgba(255,255,255,.9);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 42px;

    cursor: pointer;
    z-index: 5;

    background: rgba(0,0,0,.15);
}

.center-play i {
    margin-left: 7px;
}

/* CONTROLS */

.controls-wrapper {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;

    padding: 0 16px;

    transition: opacity .25s ease;
}

/* PROGRESS */

.progress-container {
    width: 100%;
    height: 20px;

    display: flex;
    align-items: center;

    cursor: pointer;
    margin-bottom: 18px;
}

.progress-bg {
    position: relative;

    width: 100%;
    height: 6px;

    background: #3b3b3d;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;

    background: #eee;
    border-radius: 10px;
}

/* BOTTOM BAR */

.controls {
    height: 100px;

    width: 100%;

    background: #19191f;

    border: 1px solid #32323a;
    border-radius: 40px;

    display: flex;
    align-items: center;

    padding: 0 28px;
    gap: 28px;

    color: #eee;
}

.control-btn {
    border: 0;
    outline: 0;
    background: transparent;

    color: #eee;

    font-size: 29px;

    cursor: pointer;
}

.volume {
    display: flex;
    align-items: center;
    gap: 10px;
}

.time {
    font-size: 21px;
    font-weight: 600;
    color: #aaa;
}

.spacer {
    flex: 1;
}

.settings-btn {
    font-size: 32px;
}

.fullscreen-btn {
    font-size: 27px;
}

/* SETTINGS MENU */

.settings-menu {
    position: absolute;

    right: 25px;
    bottom: 135px;

    min-width: 190px;

    background: #1d1d22;

    border: 1px solid #38383f;
    border-radius: 16px;

    padding: 10px;

    color: white;

    display: none;
}

.settings-menu.show {
    display: block;
}

.setting-title {
    padding: 10px 12px;

    font-family: "Sora", sans-serif;
    font-size: 13px;

    color: #999;
}

.quality {
    padding: 12px;

    border-radius: 10px;

    cursor: pointer;
}

.quality:hover {
    background: #303037;
}

/* MOBILE */

@media(max-width:600px) {

    .controls-wrapper {
        bottom: 16px;
        padding: 0;
    }

    .progress-container {
        padding: 0 17px;
        margin-bottom: 18px;
    }

    .controls {
        border-radius: 38px;

        padding: 0 35px;

        height: 100px;

        gap: 24px;
    }

    .control-btn {
        font-size: 25px;
    }

    .time {
        font-size: 19px;
    }

    .center-play {
        width: 90px;
        height: 90px;
        font-size: 36px;
    }
}

.hidden {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="player" id="player">

    <video id="video" playsinline></video>

    <div class="center-play" id="centerPlay">
        <i class="fas fa-play"></i>
    </div>

    <div class="controls-wrapper" id="controlsWrapper">

        <div class="progress-container" id="progressContainer">
            <div class="progress-bg">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="controls">

            <button class="control-btn" id="playBtn">
                <i class="fas fa-play"></i>
            </button>

            <div class="volume">
                <button class="control-btn" id="volumeBtn">
                    <i class="fas fa-volume-high"></i>
                </button>
            </div>

            <div class="time" id="time">
                0:00
            </div>

            <div class="spacer"></div>

            <button class="control-btn settings-btn" id="settingsBtn">
                <i class="fas fa-gear"></i>
            </button>

            <button class="control-btn fullscreen-btn" id="fullscreenBtn">
                <i class="fas fa-expand"></i>
            </button>

        </div>

        <div class="settings-menu" id="settingsMenu">

            <div class="setting-title">
                QUALITY
            </div>

            <div class="quality" data-level="-1">
                Auto
            </div>

            <div id="qualityLevels"></div>

        </div>

    </div>

</div>

<script>

const video = document.getElementById("video");
const player = document.getElementById("player");

const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");

const volumeBtn = document.getElementById("volumeBtn");

const progressContainer =
document.getElementById("progressContainer");

const progress =
document.getElementById("progress");

const time =
document.getElementById("time");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const settingsBtn =
document.getElementById("settingsBtn");

const settingsMenu =
document.getElementById("settingsMenu");

const qualityLevels =
document.getElementById("qualityLevels");


/*
====================================
PUT YOUR M3U8 URL HERE
====================================
*/

const streamURL =
"https://in-mc-flive.fancode.com/mumbai/4248014_english_hls_f31f9db7ea17108_1ta-di_h264/1080p.m3u8?hdntl=Expires=1785669128~_GO=Generated~acl=/mumbai/4248014_english_hls_f31f9db7ea17108_1ta-di_h264/*~Signature=Aej9sTVEc_-agT_rhrst9Z4YF09vnnWWgSmzmAKdOqZjjHAAOHeX5WzTrEfO9erQsIaqpUp06hczrR_I68S7QuvY3pYN";


let hls;


/* LOAD HLS */

if (Hls.isSupported()) {

    hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
    });

    hls.loadSource(streamURL);

    hls.attachMedia(video);


    hls.on(Hls.Events.MANIFEST_PARSED, function() {

        buildQualityMenu();

    });

}

else if (
    video.canPlayType("application/vnd.apple.mpegurl")
) {

    video.src = streamURL;

}


/* PLAY */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

}


playBtn.onclick = togglePlay;
centerPlay.onclick = togglePlay;


video.addEventListener("play", () => {

    playBtn.innerHTML =
    '<i class="fas fa-pause"></i>';

    centerPlay.style.display = "none";

});


video.addEventListener("pause", () => {

    playBtn.innerHTML =
    '<i class="fas fa-play"></i>';

    centerPlay.style.display = "flex";

});


/* VOLUME */

volumeBtn.onclick = () => {

    video.muted = !video.muted;

    if(video.muted) {

        volumeBtn.innerHTML =
        '<i class="fas fa-volume-xmark"></i>';

    } else {

        volumeBtn.innerHTML =
        '<i class="fas fa-volume-high"></i>';

    }

};


/* TIME */

function formatTime(seconds) {

    if(!isFinite(seconds))
        return "0:00";

    const min =
    Math.floor(seconds / 60);

    const sec =
    Math.floor(seconds % 60)
    .toString()
    .padStart(2,"0");

    return `${min}:${sec}`;

}


video.addEventListener("timeupdate", () => {

    time.textContent =
    formatTime(video.currentTime);

    if(video.duration) {

        const percent =
        (video.currentTime /
        video.duration) * 100;

        progress.style.width =
        percent + "%";

    }

});


/* SEEK */

progressContainer.onclick = (e) => {

    if(!video.duration)
        return;

    const rect =
    progressContainer.getBoundingClientRect();

    const percent =
    (e.clientX - rect.left) /
    rect.width;

    video.currentTime =
    percent * video.duration;

};


/* FULLSCREEN */

fullscreenBtn.onclick = () => {

    if(!document.fullscreenElement) {

        player.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

};


/* SETTINGS */

settingsBtn.onclick = (e) => {

    e.stopPropagation();

    settingsMenu.classList.toggle("show");

};


document.addEventListener("click", (e) => {

    if(
        !settingsMenu.contains(e.target) &&
        !settingsBtn.contains(e.target)
    ) {

        settingsMenu.classList.remove("show");

    }

});


/* QUALITY MENU */

function buildQualityMenu() {

    if(!hls)
        return;

    qualityLevels.innerHTML = "";

    const qualities = [];

    hls.levels.forEach((level,index) => {

        if(
            !qualities.some(
                q => q.height === level.height
            )
        ) {

            qualities.push({
                height: level.height,
                index: index
            });

        }

    });


    qualities
    .sort((a,b) => b.height-a.height)
    .forEach(q => {

        const item =
        document.createElement("div");

        item.className = "quality";

        item.textContent =
        q.height + "p";

        item.onclick = () => {

            hls.currentLevel =
            q.index;

            settingsMenu
            .classList.remove("show");

        };

        qualityLevels
        .appendChild(item);

    });

}


/* AUTO QUALITY */

document
.querySelector('[data-level="-1"]')
.onclick = () => {

    if(hls)
        hls.currentLevel = -1;

    settingsMenu
    .classList.remove("show");

};

</script>

</body>
</html>
