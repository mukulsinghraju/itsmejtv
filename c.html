<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.video-area {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* MESSAGE */

.player-message {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    text-align: center;
    padding: 20px;
    pointer-events: none;
    z-index: 5;
}

.player-message.flex {
    display: flex;
}

/* CENTER PLAY/PAUSE FLASH */

.center-flash {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.8);
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: .2s;
    pointer-events: none;
    z-index: 8;
}

.center-flash.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.center-flash svg {
    width: 32px;
    height: 32px;
    fill: white;
}

/* BOTTOM GRADIENT */

.controls-gradient {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 120px;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.8)
    );
    pointer-events: none;
    transition: opacity .25s;
}

/* CONTROLS */

.controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 14px 12px;
    z-index: 10;
    transition: opacity .25s;
}

.video-area.hide-controls .controls,
.video-area.hide-controls .controls-gradient {
    opacity: 0;
    pointer-events: none;
}

/* PROGRESS */

.progress-track {
    width: 100%;
    height: 18px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.progress-bg {
    position: absolute;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.35);
    border-radius: 4px;
}

.progress-filled {
    position: absolute;
    width: 0%;
    height: 4px;
    background: #fff;
    border-radius: 4px;
}

.progress-thumb {
    position: absolute;
    left: 0%;
    width: 13px;
    height: 13px;
    background: white;
    border-radius: 50%;
    transform: translateX(-50%);
}

/* CONTROL ROW */

.control-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.ios-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.ios-btn svg {
    width: 23px;
    height: 23px;
    fill: white;
}

.hidden {
    display: none !important;
}

.cur-time {
    color: white;
    font-size: 13px;
    margin-left: 2px;
}

.spacer {
    flex: 1;
}

/* QUALITY */

.quality-wrapper {
    position: relative;
}

.quality-btn {
    font-size: 13px;
    font-weight: bold;
}

.quality-menu {
    position: absolute;
    right: 0;
    bottom: 48px;
    width: 150px;
    background: rgba(25,25,25,.96);
    border-radius: 8px;
    padding: 6px;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

.quality-menu.open {
    display: block;
}

.quality-item {
    padding: 10px 12px;
    color: #ddd;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
}

.quality-item:hover {
    background: rgba(255,255,255,.1);
}

.quality-item.active {
    color: #fff;
    background: rgba(255,255,255,.15);
}

@media(max-width:600px) {

    .controls {
        padding: 0 8px 8px;
    }

    .ios-btn {
        width: 37px;
        height: 37px;
    }

    .quality-menu {
        right: -35px;
    }
}
</style>
</head>

<body>

<div class="video-area" id="video-area">

    <video
        id="native-video"
        playsinline
        webkit-playsinline>
    </video>

    <div id="player-message" class="player-message"></div>

    <!-- CENTER FLASH -->

    <div id="center-flash" class="center-flash">

        <svg id="center-play-svg" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>

        <svg id="center-pause-svg" class="hidden" viewBox="0 0 24 24">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
        </svg>

    </div>

    <div class="controls-gradient"></div>

    <div class="controls">

        <!-- PROGRESS -->

        <div id="progress-track" class="progress-track">

            <div class="progress-bg"></div>

            <div
                id="progress-filled"
                class="progress-filled">
            </div>

            <div
                id="progress-thumb"
                class="progress-thumb">
            </div>

        </div>

        <!-- BUTTONS -->

        <div class="control-row">

            <button id="play-pause-btn" class="ios-btn">

                <svg id="icon-play" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>

                <svg id="icon-pause" class="hidden" viewBox="0 0 24 24">
                    <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
                </svg>

            </button>

            <button id="mute-btn" class="ios-btn">

                <svg id="icon-muted" viewBox="0 0 24 24">
                    <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM3 4.3 4.3 3 21 19.7 19.7 21l-3.3-3.3c-.7.5-1.5.9-2.4 1.2v-2.1c.3-.1.6-.3.9-.5L12 13.4V19l-5-4H3v-6h2.6L3 6.4z"/>
                </svg>

                <svg id="icon-unmuted" class="hidden" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
                </svg>

            </button>

            <span id="cur-time" class="cur-time">0:00</span>

            <div class="spacer"></div>

            <!-- QUALITY -->

            <div class="quality-wrapper">

                <button
                    id="quality-btn"
                    class="ios-btn quality-btn">
                    HD
                </button>

                <div
                    id="quality-menu"
                    class="quality-menu">
                </div>

            </div>

            <!-- FULLSCREEN -->

            <button id="fs-btn" class="ios-btn">

                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zm-3-12v2h3v3h2V5h-5z"/>
                </svg>

            </button>

        </div>

    </div>

</div>

<script>

let hlsInstance = null;
let isDragging = false;
let controlsTimer = null;
let isQualityMenuOpen = false;

const video = document.getElementById("native-video");
const videoArea = document.getElementById("video-area");

const message =
document.getElementById("player-message");

const playPauseBtn =
document.getElementById("play-pause-btn");

const iconPlay =
document.getElementById("icon-play");

const iconPause =
document.getElementById("icon-pause");

const muteBtn =
document.getElementById("mute-btn");

const iconMuted =
document.getElementById("icon-muted");

const iconUnmuted =
document.getElementById("icon-unmuted");

const centerFlash =
document.getElementById("center-flash");

const centerPlaySvg =
document.getElementById("center-play-svg");

const centerPauseSvg =
document.getElementById("center-pause-svg");

const progressTrack =
document.getElementById("progress-track");

const progressFilled =
document.getElementById("progress-filled");

const progressThumb =
document.getElementById("progress-thumb");

const curTimeEl =
document.getElementById("cur-time");

const qualityBtn =
document.getElementById("quality-btn");

const qualityMenu =
document.getElementById("quality-menu");

const fsBtn =
document.getElementById("fs-btn");


/* =========================
   INITIAL
========================= */

video.muted = true;
updateMuteIcon();


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", e => {

    if (e.key === "Escape") {

        if (document.fullscreenElement) {
            document.exitFullscreen();
        }

    }

    if (e.key === " ") {

        e.preventDefault();

        togglePlay();

    }

    if (e.key === "m" || e.key === "M") {

        e.preventDefault();

        video.muted = !video.muted;

    }

});


/* =========================
   PLAY / PAUSE
========================= */

playPauseBtn.addEventListener(
    "click",
    togglePlay
);

videoArea.addEventListener("click", e => {

    if (
        e.target.closest(".ios-btn") ||
        e.target.closest(".progress-track") ||
        e.target.closest(".quality-menu")
    ) {
        return;
    }

    togglePlay();

});


function togglePlay() {

    if (video.paused) {

        video.play().catch(() => {
            showMessage(
                "Click play to start the stream."
            );
        });

    } else {

        video.pause();

    }

}


video.addEventListener(
    "play",
    updatePlayIcon
);

video.addEventListener(
    "pause",
    updatePlayIcon
);


function updatePlayIcon() {

    const paused = video.paused;

    iconPlay.classList.toggle(
        "hidden",
        !paused
    );

    iconPause.classList.toggle(
        "hidden",
        paused
    );

    centerPlaySvg.classList.toggle(
        "hidden",
        !paused
    );

    centerPauseSvg.classList.toggle(
        "hidden",
        paused
    );

    centerFlash.classList.add("show");

    setTimeout(() => {

        centerFlash.classList.remove("show");

    },300);

    resetAutoHide();

}


/* =========================
   MUTE
========================= */

muteBtn.addEventListener("click", e => {

    e.stopPropagation();

    video.muted = !video.muted;

    if (!video.muted && video.volume === 0) {
        video.volume = 0.5;
    }

});


video.addEventListener(
    "volumechange",
    updateMuteIcon
);


function updateMuteIcon() {

    const muted =
        video.muted ||
        video.volume === 0;

    iconMuted.classList.toggle(
        "hidden",
        !muted
    );

    iconUnmuted.classList.toggle(
        "hidden",
        muted
    );

}


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    updateProgress
);

video.addEventListener(
    "loadedmetadata",
    () => {

        curTimeEl.textContent =
            formatTime(video.currentTime);

    }
);


function updateProgress() {

    if (isDragging) return;

    if (!video.duration) return;

    const percent =
        (video.currentTime /
        video.duration) * 100;

    progressFilled.style.width =
        percent + "%";

    progressThumb.style.left =
        percent + "%";

    curTimeEl.textContent =
        formatTime(video.currentTime);

}


progressTrack.addEventListener(
    "mousedown",
    startDrag
);

progressTrack.addEventListener(
    "touchstart",
    startDrag,
    { passive:false }
);

document.addEventListener(
    "mousemove",
    onDrag
);

document.addEventListener(
    "touchmove",
    onDrag,
    { passive:false }
);

document.addEventListener(
    "mouseup",
    endDrag
);

document.addEventListener(
    "touchend",
    endDrag
);


function startDrag(e) {

    e.preventDefault();

    isDragging = true;

    videoArea.classList.remove(
        "hide-controls"
    );

    seekToEvent(e);

}


function onDrag(e) {

    if (!isDragging) return;

    e.preventDefault();

    seekToEvent(e);

}


function endDrag() {

    if (!isDragging) return;

    isDragging = false;

    resetAutoHide();

}


function seekToEvent(e) {

    const rect =
        progressTrack.getBoundingClientRect();

    const clientX =
        e.touches
        ? e.touches[0].clientX
        : e.clientX;

    let percent =
        (clientX - rect.left) /
        rect.width;

    percent =
        Math.max(
            0,
            Math.min(1, percent)
        );

    progressFilled.style.width =
        percent * 100 + "%";

    progressThumb.style.left =
        percent * 100 + "%";

    if (video.duration) {

        video.currentTime =
            percent * video.duration;

        curTimeEl.textContent =
            formatTime(video.currentTime);

    }

}


/* =========================
   TIME
========================= */

function formatTime(seconds) {

    if (
        !seconds ||
        !isFinite(seconds)
    ) {
        return "0:00";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);

    if (hours > 0) {

        return (
            hours + ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0")
        );

    }

    return (
        minutes + ":" +
        String(secs).padStart(2,"0")
    );

}


/* =========================
   QUALITY MENU
========================= */

qualityBtn.addEventListener(
    "click",
    e => {

        e.stopPropagation();

        qualityMenu.classList.toggle(
            "open"
        );

        isQualityMenuOpen =
            qualityMenu.classList.contains(
                "open"
            );

        resetAutoHide();

    }
);


document.addEventListener(
    "click",
    e => {

        if (
            isQualityMenuOpen &&
            !qualityMenu.contains(e.target) &&
            e.target !== qualityBtn
        ) {

            qualityMenu.classList.remove(
                "open"
            );

            isQualityMenuOpen = false;

        }

    }
);


function buildQualityMenu(
    selectedLevel = -1
) {

    qualityMenu.innerHTML = "";

    const qualities = [{
        name:"Auto",
        level:-1
    }];


    if (
        hlsInstance &&
        hlsInstance.levels.length
    ) {

        hlsInstance.levels.forEach(
            (level,index) => {

                let name =
                    level.height
                    ? level.height + "p"
                    : "Level " + (index + 1);

                if (level.bitrate) {

                    name +=
                        " (" +
                        (
                            level.bitrate /
                            1000000
                        ).toFixed(1) +
                        " Mbps)";

                }

                qualities.push({
                    name,
                    level:index
                });

            }
        );

    } else {

        qualities.push({
            name:"Native",
            level:-2
        });

    }


    qualities.forEach(q => {

        const item =
            document.createElement("div");

        item.className =
            "quality-item";

        if (
            q.level === selectedLevel
        ) {

            item.classList.add(
                "active"
            );

        }

        item.textContent = q.name;

        item.addEventListener(
            "click",
            e => {

                e.stopPropagation();

                if (
                    hlsInstance &&
                    q.level >= -1
                ) {

                    hlsInstance.currentLevel =
                        q.level;

                }

                qualityMenu.classList.remove(
                    "open"
                );

                isQualityMenuOpen = false;

                buildQualityMenu(
                    q.level
                );

            }
        );

        qualityMenu.appendChild(item);

    });

}


/* =========================
   FULLSCREEN
========================= */

fsBtn.addEventListener(
    "click",
    toggleFullscreen
);

video.addEventListener(
    "dblclick",
    toggleFullscreen
);


function toggleFullscreen() {

    if (!document.fullscreenElement) {

        videoArea
            .requestFullscreen?.();

    } else {

        document
            .exitFullscreen?.();

    }

    resetAutoHide();

}


/* =========================
   AUTO HIDE
========================= */

videoArea.addEventListener(
    "mousemove",
    resetAutoHide
);

videoArea.addEventListener(
    "touchstart",
    resetAutoHide,
    { passive:true }
);


function resetAutoHide() {

    videoArea.classList.remove(
        "hide-controls"
    );

    clearTimeout(controlsTimer);

    if (
        !video.paused &&
        !isDragging &&
        !isQualityMenuOpen
    ) {

        controlsTimer =
            setTimeout(() => {

                videoArea.classList.add(
                    "hide-controls"
                );

            },3000);

    }

}


/* =========================
   LOAD STREAM
========================= */

function loadStream(
    streamUrl,
    startTime = 0
) {

    showMessage("");

    stopPlayer();

    video.muted = true;

    updateMuteIcon();


    const isM3U8 =
        streamUrl
            .toLowerCase()
            .includes(".m3u8");


    /*
     Native HLS support
     Mainly Safari/iOS
    */

    if (
        !isM3U8 ||
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = streamUrl;

        video.addEventListener(
            "loadedmetadata",
            () => {

                if (startTime > 0) {
                    video.currentTime =
                        startTime;
                }

                video.play()
                    .catch(() => {

                        showMessage(
                            "Click play to start the stream."
                        );

                    });

                buildQualityMenu(-1);

            },
            { once:true }
        );

        return;

    }


    /*
     HLS.js
    */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hlsInstance =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                xhrSetup:xhr => {

                    xhr.withCredentials =
                        false;

                },

                abrEwmaDefaultEstimate:
                    5000000,

                maxBufferLength:30,

                maxMaxBufferLength:60

            });


        hlsInstance.loadSource(
            streamUrl
        );

        hlsInstance.attachMedia(
            video
        );


        hlsInstance.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                buildQualityMenu(-1);

                if (startTime > 0) {

                    video.currentTime =
                        startTime;

                }

                video.play()
                    .catch(() => {

                        showMessage(
                            "Click play to start the stream."
                        );

                    });

            }
        );


        hlsInstance.on(
            Hls.Events.LEVEL_SWITCHED,
            (event,data) => {

                /*
                Keep Auto highlighted
                when ABR is enabled.
                */

                const selected =
                    hlsInstance.autoLevelEnabled
                    ? -1
                    : data.level;

                buildQualityMenu(
                    selected
                );

            }
        );


        hlsInstance.on(
            Hls.Events.ERROR,
            (event,data) => {

                if (!data.fatal) {
                    return;
                }

                switch(data.type) {

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        showMessage(
                            "Network error. Trying to recover..."
                        );

                        hlsInstance.startLoad();

                        break;


                    case Hls.ErrorTypes.MEDIA_ERROR:

                        showMessage(
                            "Media error. Trying to recover..."
                        );

                        hlsInstance
                            .recoverMediaError();

                        break;


                    default:

                        showMessage(
                            "This stream could not be played. Check the URL."
                        );

                        stopPlayer();

                        break;

                }

            }
        );

        return;

    }


    showMessage(
        "This browser cannot play HLS streams."
    );

}


/* =========================
   STOP
========================= */

function stopPlayer() {

    if (hlsInstance) {

        hlsInstance.destroy();

        hlsInstance = null;

    }

    video.pause();

    video.removeAttribute("src");

    video.load();

    buildQualityMenu(-1);

}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    message.textContent = text;

    message.classList.toggle(
        "flex",
        Boolean(text)
    );

}


/* =========================
   URL PARAMETER
========================= */

buildQualityMenu(-1);

const params =
    new URLSearchParams(
        window.location.search
    );

const playUrl =
    params.get("url") ||
    params.get("play");


if (playUrl) {

    loadStream(playUrl);

} else {

    showMessage(
        "No stream URL provided. Use ?url=https://example.com/stream.m3u8"
    );

}

</script>

</body>
</html>
