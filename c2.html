<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Telegram-Live-Cric-Hd</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
    overscroll-behavior:none;
}

/* Top Banner */
.banner{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:52px;
    background:#5B3A29;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
    text-align:center;
    z-index:99999;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
    padding:0 12px;
}

/* Player Container */
.player{
    position:fixed;
    left:0;
    top:52px;
    width:100%;
    height:calc(100% - 52px);
    overflow:hidden;
}

/* Crop iframe top */
.player iframe{
    position:absolute;
    top:-70px;
    left:0;
    width:100%;
    height:calc(100% + 70px);
    border:none;
    overflow:hidden;
    pointer-events:auto;
}
</style>
</head>

<body>

<div class="banner">
ᴄʟɪᴄᴋ ᴘʟᴀʏ ꜱᴛʀᴇᴀᴍ ʙᴜᴛᴛᴏɴ ᴛᴏ ꜱᴛᴀʀᴛ ᴛʜᴇ ꜱᴛʀᴇᴀᴍ
</div>

<div class="player">
    <iframe
        id="playerFrame"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen
        loading="eager"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock">
    </iframe>
</div>

<script src="player.js"></script>

</body>
</html>
